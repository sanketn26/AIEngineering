<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" role="img" aria-labelledby="hybTitle hybDesc">
  <title id="hybTitle">Hybrid search</title>
  <desc id="hybDesc">A vector search and a keyword search each return a ranked list. Reciprocal rank fusion combines the ranks into one shortlist.</desc>
  <rect width="980" height="230" rx="18" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Two ranked lists, then one shortlist</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="28" y="70" width="250" height="72" rx="12" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="153" y="102" text-anchor="middle" font-weight="700" fill="#312e81">Vector search</text>
    <text x="153" y="122" text-anchor="middle" font-size="12" fill="#4338ca">paraphrase and meaning</text>
    <rect x="28" y="156" width="250" height="52" rx="12" fill="#fef3c7" stroke="#fde68a"/>
    <text x="153" y="188" text-anchor="middle" font-weight="700" fill="#78350f">Keyword search · BM25</text>
    <rect x="390" y="108" width="220" height="64" rx="12" fill="#fff" stroke="#0f766e"/>
    <text x="500" y="136" text-anchor="middle" font-weight="700" fill="#115e59">Fuse ranks</text>
    <text x="500" y="156" text-anchor="middle" font-size="12" fill="#0f766e">RRF, not raw scores</text>
    <rect x="720" y="108" width="232" height="64" rx="12" fill="#ccfbf1" stroke="#99f6e4"/>
    <text x="836" y="146" text-anchor="middle" font-weight="700" fill="#134e4a">Best chunks</text>
    <path d="M278 106 C340 106 340 130 382 130" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#hybArrow)"/>
    <path d="M278 182 C340 182 340 150 382 150" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#hybArrow)"/>
    <path d="M610 140 H712" stroke="#94a3b8" stroke-width="2" marker-end="url(#hybArrow)"/>
  </g>
  <defs>
    <marker id="hybArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
