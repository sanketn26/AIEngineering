<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="amTitle amDesc">
  <title id="amTitle">Amdahl ceiling for agents</title>
  <desc id="amDesc">At 95 percent independent work, 16 agents buy about 9 times speedup, not 16. At 70 percent, they buy about 3.</desc>
  <rect width="980" height="460" rx="18" fill="#f8fafc"/>
  <text x="28" y="38" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">More agents do not scale in a straight line</text>
  <text x="28" y="62" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">S = 1 / ((1 − p) + p / N). p is the fraction of edges that survived the fake-edge test.</text>
  <line x1="90" y1="90" x2="90" y2="360" stroke="#cbd5e1"/>
  <line x1="90" y1="360" x2="900" y2="360" stroke="#cbd5e1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">
    <text x="78" y="364" text-anchor="end">0</text>
    <text x="78" y="294" text-anchor="end">5×</text>
    <text x="78" y="224" text-anchor="end">10×</text>
    <text x="78" y="154" text-anchor="end">15×</text>
    <text x="78" y="94" text-anchor="end">20×</text>
    <text x="90" y="384" text-anchor="middle">1</text>
    <text x="180" y="384" text-anchor="middle">2</text>
    <text x="270" y="384" text-anchor="middle">4</text>
    <text x="360" y="384" text-anchor="middle">8</text>
    <text x="450" y="384" text-anchor="middle">16</text>
    <text x="540" y="384" text-anchor="middle">32</text>
    <text x="630" y="384" text-anchor="middle">64</text>
    <text x="720" y="384" text-anchor="middle">128</text>
    <text x="810" y="384" text-anchor="middle">256</text>
    <text x="490" y="420" text-anchor="middle" font-size="12">Number of agents</text>
  </g>
  <line x1="90" y1="90" x2="900" y2="90" stroke="#93c5fd" stroke-dasharray="4 4"/>
  <text x="908" y="94" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2563eb">ceiling p=0.95</text>
  <polyline fill="none" stroke="#4f46e5" stroke-width="3" points="90,346 180,333 270,311 360,277 450,232 540,184 630,144 720,116 810,100"/>
  <polyline fill="none" stroke="#d97706" stroke-width="3" points="90,346 180,338 270,330 360,324 450,319 540,316 630,314 720,313 810,312"/>
  <circle cx="450" cy="232" r="5" fill="#4f46e5"/>
  <text x="468" y="220" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#312e81">×9.14, not ×16</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <rect x="28" y="430" width="14" height="14" rx="3" fill="#4f46e5"/>
    <text x="50" y="442" fill="#312e81">p = 0.95 mostly independent</text>
    <rect x="280" y="430" width="14" height="14" rx="3" fill="#d97706"/>
    <text x="302" y="442" fill="#78350f">p = 0.70 · 16 agents buy about ×2.9</text>
  </g>
</svg>
