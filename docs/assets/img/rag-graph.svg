<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" role="img" aria-labelledby="grTitle grDesc">
  <title id="grTitle">Graph retrieval</title>
  <desc id="grDesc">A question about an edge walks one or two hops from a service to what it depends on and who owns it, then reads the text of those nodes.</desc>
  <rect width="980" height="200" rx="18" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Follow the edge, then read the text</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="28" y="78" width="200" height="64" rx="12" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="128" y="116" text-anchor="middle" font-weight="700" fill="#312e81">Service X</text>
    <rect x="390" y="78" width="220" height="64" rx="12" fill="#ccfbf1" stroke="#99f6e4"/>
    <text x="500" y="116" text-anchor="middle" font-weight="700" fill="#134e4a">Billing</text>
    <rect x="752" y="78" width="200" height="64" rx="12" fill="#fef3c7" stroke="#fde68a"/>
    <text x="852" y="116" text-anchor="middle" font-weight="700" fill="#78350f">Payments team</text>
    <path d="M228 110 H378" stroke="#94a3b8" stroke-width="2" marker-end="url(#grArrow)"/>
    <path d="M610 110 H740" stroke="#94a3b8" stroke-width="2" marker-end="url(#grArrow)"/>
    <text x="303" y="100" text-anchor="middle" font-size="12" fill="#64748b">depends on</text>
    <text x="675" y="100" text-anchor="middle" font-size="12" fill="#64748b">owned by</text>
  </g>
  <defs>
    <marker id="grArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
