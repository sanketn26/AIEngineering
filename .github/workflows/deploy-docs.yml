name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Compute site_url for project Pages
        id: site
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          # Project site: https://<owner>.github.io/<repo>/
          # User/org site (repo named <owner>.github.io): https://<owner>.github.io/
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            SITE_URL="https://${OWNER}.github.io/"
          else
            SITE_URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "Using site_url=$SITE_URL"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Build MkDocs
        run: mkdocs build --strict --site-url "${{ steps.site.outputs.site_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
