<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" role="img" aria-labelledby="ldTitle ldDesc">
  <title id="ldTitle">Loop until dry</title>
  <desc id="ldDesc">A finding is marked seen the moment it is found. Only unseen findings go to verification. Two dry rounds, a token budget, and a max iteration count all stop the loop.</desc>
  <rect width="980" height="320" rx="18" fill="#f8fafc"/>
  <text x="28" y="38" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Mark it seen when it is found, not after it is judged</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="28" y="80" width="150" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="103" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Finders</text>
    <text x="103" y="130" text-anchor="middle" font-size="12" fill="#4338ca">parallel</text>
    <rect x="230" y="80" width="180" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="320" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Seen set</text>
    <text x="320" y="128" text-anchor="middle" font-size="12" fill="#92400e">add on discovery</text>
    <rect x="460" y="80" width="180" height="70" rx="12" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="550" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Verify fresh only</text>
    <text x="550" y="128" text-anchor="middle" font-size="12" fill="#0f766e">duplicates never reset dry</text>
    <rect x="690" y="80" width="180" height="70" rx="12" fill="#ffe4e6" stroke="#e11d48"/>
    <text x="780" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">Dry counter</text>
    <text x="780" y="128" text-anchor="middle" font-size="12" fill="#be123c">+1 only if nothing new</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M178 115 H230"/>
    <path d="M410 115 H460"/>
    <path d="M640 115 H690"/>
  </g>
  <path d="M780 150 C780 200, 103 200, 103 150" fill="none" stroke="#4f46e5" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4338ca">loop while dry rounds are still under the cap</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <rect x="28" y="230" width="290" height="58" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="173" y="264" text-anchor="middle" fill="#0f172a">Stop · 2 dry rounds</text>
    <rect x="340" y="230" width="290" height="58" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="485" y="264" text-anchor="middle" fill="#0f172a">Stop · token budget</text>
    <rect x="652" y="230" width="300" height="58" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="802" y="264" text-anchor="middle" fill="#0f172a">Stop · max iterations</text>
  </g>
</svg>
