[tool.poetry]
name = "aiengineering"
version = "0.2.0"
description = "AI Engineering course sandbox — prompts, security, RAG, agents, evals"
authors = ["sanket"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11,<3.14"
# Core teaching modules (security, rag, agents, …) need only the stdlib.
# Track / data-science extras:
pandas = {version = "^2.2.0", optional = true}
numpy = {version = "^2.0.0", optional = true}
scikit-learn = {version = "^1.5.0", optional = true}
matplotlib = {version = "^3.9.0", optional = true}
yfinance = {version = "^0.2.40", optional = true}

[tool.poetry.extras]
track-data = ["pandas", "numpy", "scikit-learn", "matplotlib", "yfinance"]
all = ["pandas", "numpy", "scikit-learn", "matplotlib", "yfinance"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "track_data: tests that need pandas/numpy track extras",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
