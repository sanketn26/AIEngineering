{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.is_homepage %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Course",
    "name": "{{ config.site_name }}",
    "description": "{{ config.site_description }}",
    "provider": {
      "@type": "Organization",
      "name": "{{ config.site_author }}",
      "sameAs": "{{ config.repo_url }}"
    },
    "url": "{{ config.site_url }}",
    "isAccessibleForFree": true,
    "hasCourseInstance": {
      "@type": "CourseInstance",
      "courseMode": "online",
      "courseWorkload": "PT60H"
    },
    "about": [
      "Prompt Engineering", "Retrieval-Augmented Generation", "Fine-Tuning",
      "Multi-Agent Systems", "LLM Evaluation", "AI Agent Orchestration",
      "Production AI Systems", "AI Security"
    ]
  }
  </script>
  {% endif %}
{% endblock %}
