<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="metaTitle metaDesc">
  <title id="metaTitle">Metadata filter before top-k</title>
  <desc id="metaDesc">A tier and department filter removes other rows first. Similarity then ranks only the rows that remain.</desc>
  <rect width="980" height="250" rx="18" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Filter the rows, then take top-k</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="28" y="58" width="300" height="168" rx="12" fill="#fff" stroke="#c7d2fe"/>
    <text x="48" y="90" font-size="13" font-weight="700" fill="#312e81">where</text>
    <text x="48" y="118" font-size="14" fill="#0f172a">tier = enterprise</text>
    <text x="48" y="144" font-size="14" fill="#0f172a">department = support</text>
    <text x="48" y="186" font-size="12" fill="#64748b">A missing key does not match.</text>
    <text x="48" y="206" font-size="12" fill="#64748b">The model never sees the rest.</text>
    <rect x="360" y="58" width="592" height="44" rx="8" fill="#f1f5f9"/>
    <text x="380" y="86" font-size="14" fill="#94a3b8">30 days · tier=standard · dropped</text>
    <rect x="360" y="112" width="592" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="380" y="136" font-size="14" font-weight="700" fill="#134e4a">14 days · tier=enterprise · kept</text>
    <text x="380" y="154" font-size="12" fill="#0f766e">Similarity ranks inside this set</text>
    <rect x="360" y="174" width="592" height="44" rx="8" fill="#f1f5f9"/>
    <text x="380" y="202" font-size="14" fill="#94a3b8">Payroll · department=hr · dropped</text>
  </g>
</svg>
