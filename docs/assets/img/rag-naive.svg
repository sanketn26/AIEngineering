<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="naiveTitle naiveDesc">
  <title id="naiveTitle">Naive RAG pipeline</title>
  <desc id="naiveDesc">Documents are chunked, embedded, and stored. A question takes the nearest chunks, and the model answers with those sources.</desc>
  <rect width="980" height="250" rx="18" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Naive RAG is nearest neighbors, then a prompt</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="28" y="64" font-size="12" font-weight="700" fill="#64748b">Index once</text>
    <rect x="28" y="76" width="200" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="128" y="107" text-anchor="middle" fill="#0f172a">Documents</text>
    <rect x="262" y="76" width="200" height="52" rx="10" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="362" y="107" text-anchor="middle" fill="#312e81">Chunking</text>
    <rect x="496" y="76" width="200" height="52" rx="10" fill="#ccfbf1" stroke="#99f6e4"/>
    <text x="596" y="107" text-anchor="middle" fill="#134e4a">Embeddings</text>
    <rect x="730" y="76" width="222" height="52" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text x="841" y="107" text-anchor="middle" fill="#78350f">Vector index</text>
    <path d="M228 102 H254" stroke="#94a3b8" stroke-width="2" marker-end="url(#naiveArrow)"/>
    <path d="M462 102 H488" stroke="#94a3b8" stroke-width="2" marker-end="url(#naiveArrow)"/>
    <path d="M696 102 H722" stroke="#94a3b8" stroke-width="2" marker-end="url(#naiveArrow)"/>
    <text x="28" y="160" font-size="12" font-weight="700" fill="#64748b">Each question</text>
    <rect x="28" y="172" width="200" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="128" y="203" text-anchor="middle" fill="#0f172a">Similarity search</text>
    <rect x="262" y="172" width="200" height="52" rx="10" fill="#e0e7ff" stroke="#c7d2fe"/>
    <text x="362" y="203" text-anchor="middle" fill="#312e81">Top-K chunks</text>
    <rect x="496" y="172" width="200" height="52" rx="10" fill="#ccfbf1" stroke="#99f6e4"/>
    <text x="596" y="203" text-anchor="middle" fill="#134e4a">LLM</text>
    <rect x="730" y="172" width="222" height="52" rx="10" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="841" y="203" text-anchor="middle" fill="#115e59">Answer + source</text>
    <path d="M228 198 H254" stroke="#94a3b8" stroke-width="2" marker-end="url(#naiveArrow)"/>
    <path d="M462 198 H488" stroke="#94a3b8" stroke-width="2" marker-end="url(#naiveArrow)"/>
    <path d="M696 198 H722" stroke="#94a3b8" stroke-width="2" marker-end="url(#naiveArrow)"/>
  </g>
  <defs>
    <marker id="naiveArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
