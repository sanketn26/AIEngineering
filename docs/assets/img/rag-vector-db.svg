<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" role="img" aria-labelledby="vdbTitle vdbDesc">
  <title id="vdbTitle">Vector index row</title>
  <desc id="vdbDesc">Each stored row keeps an id, a vector, the chunk text, and metadata such as department.</desc>
  <rect width="980" height="230" rx="18" fill="#f8fafc"/>
  <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">The index stores the vector beside the text</text>
  <g font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="28" y="58" width="924" height="148" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <rect x="28" y="58" width="924" height="40" rx="12" fill="#e0e7ff"/>
    <rect x="28" y="86" width="924" height="12" fill="#e0e7ff"/>
    <text x="56" y="84" font-weight="700" fill="#312e81">ID</text>
    <text x="160" y="84" font-weight="700" fill="#312e81">Vector</text>
    <text x="420" y="84" font-weight="700" fill="#312e81">Text</text>
    <text x="820" y="84" font-weight="700" fill="#312e81">Meta</text>
    <text x="56" y="126" fill="#0f172a">1</text>
    <text x="160" y="126" fill="#475569">[0.12, −0.42, …]</text>
    <text x="420" y="126" fill="#0f172a">Refunds: 30 days</text>
    <text x="820" y="126" fill="#0f766e">tier=standard</text>
    <text x="56" y="162" fill="#0f172a">2</text>
    <text x="160" y="162" fill="#475569">[0.08, 0.55, …]</text>
    <text x="420" y="162" fill="#0f172a">Enterprise SKUs: 14 days</text>
    <text x="820" y="162" fill="#0f766e">tier=enterprise</text>
    <line x1="48" y1="140" x2="932" y2="140" stroke="#e2e8f0"/>
  </g>
</svg>
